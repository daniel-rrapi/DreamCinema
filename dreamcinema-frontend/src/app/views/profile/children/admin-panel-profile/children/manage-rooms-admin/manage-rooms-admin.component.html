<div class="container">
  <div class="d-flex justify-content-between align-items-center">
    <div>
      <h3>Manage Movie Rooms</h3>
      <h5>All Rooms</h5>
    </div>
    <svg
      xmlns="http://www.w3.org/2000/svg"
      (click)="openCreateWindows()"
      width="32"
      height="32"
      fill="currentColor"
      class="bi bi-plus-circle add-svg"
      viewBox="0 0 16 16"
    >
      <path
        d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14m0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16"
      />
      <path
        d="M8 4a.5.5 0 0 1 .5.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3A.5.5 0 0 1 8 4"
      />
    </svg>
  </div>

  <div class="row row-cols-1">
    <ul *ngIf="movieRooms">
      <li *ngFor="let movieRoom of movieRooms?.content; index as index">
        Room: {{ movieRoom.name }}
        <div class="btn btn-primary">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="16"
            height="16"
            fill="currentColor"
            class="bi bi-pencil"
            viewBox="0 0 16 16"
          >
            <path
              d="M12.146.146a.5.5 0 0 1 .708 0l3 3a.5.5 0 0 1 0 .708l-10 10a.5.5 0 0 1-.168.11l-5 2a.5.5 0 0 1-.65-.65l2-5a.5.5 0 0 1 .11-.168zM11.207 2.5 13.5 4.793 14.793 3.5 12.5 1.207zm1.586 3L10.5 3.207 4 9.707V10h.5a.5.5 0 0 1 .5.5v.5h.5a.5.5 0 0 1 .5.5v.5h.293zm-9.761 5.175-.106.106-1.528 3.821 3.821-1.528.106-.106A.5.5 0 0 1 5 12.5V12h-.5a.5.5 0 0 1-.5-.5V11h-.5a.5.5 0 0 1-.468-.325"
            />
          </svg>
        </div>
      </li>
    </ul>
  </div>
</div>

<div class="modify-room" *ngIf="isModifyMode || isCreatingMode">
  <div class="d-flex justify-content-end mt-2 me-2"></div>
  <div class="container px-5 mt-3">
    <h2 *ngIf="isModifyMode">Modify Movie Room</h2>
    <h2 *ngIf="isCreatingMode">Create a Movie Room</h2>
  </div>
</div>
